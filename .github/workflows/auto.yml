name: Deploy to EC2

on:
  push:
    branches:
      - master 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER || 'ubuntu' }} 
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |


         
          cd /home/ubuntu/FS-cicd/FS-cicd-main
          git pull origin master 
          cd ./backend
          npm install --production
          cd /home/ubuntu/FS-cicd/FS-cicd-main/frontend
          npm install --production
          npm run build
          sudo rm -rf /var/www/html/* 
          sudo cp -r /home/ubuntu/FS-cicd/FS-cicd-main/frontend/build/* /var/www/html/ 
          sudo systemctl stop myapp.service 
          sudo systemctl start myapp.service
